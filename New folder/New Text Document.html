<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codzom - Welcome</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 42px;
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
        }

        button {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0284c7;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to Codzom!</h1>
        <p>Your Cloudflare deployment is working.</p>

        <button onclick="alert('Hello from Codzom!')">
            Get Started
        </button>
    </div>

</body>

</html>
